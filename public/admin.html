<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 페이지</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
    h1 { color: #333; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #eee; }
    .error { color: red; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>📋 접속자 로그 + 위치</h1>
  <table id="log-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>IP 주소</th>
        <th>접속 시간</th>
        <th>국가</th>
        <th>도시</th>
        <th>ISP</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div class="error" id="error-msg"></div>

  <script>
    async function fetchGeo(ip) {
      try {
        const res = await fetch(`/geo?ip=${encodeURIComponent(ip)}&key=damin-secret`);
        const data = await res.json();
        return data.status === "fail" ? null : data;
      } catch {
        return null;
      }
    }

    async function loadLogs() {
      try {
        const res = await fetch("/ips?key=damin-secret");
        if (!res.ok) throw new Error("서버 응답 실패");
        const logs = await res.json();

        const tbody = document.querySelector("#log-table tbody");
        tbody.innerHTML = "";

        for (const log of logs) {
          const geo = await fetchGeo(log.ip_address);
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${log.id}</td>
            <td>${log.ip_address}</td>
            <td>${new Date(log.timestamp).toLocaleString()}</td>
            <td>${geo?.country || "-"}</td>
            <td>${geo?.city || "-"}</td>
            <td>${geo?.isp || "-"}</td>
          `;
          tbody.appendChild(row);
        }
      } catch (err) {
        document.getElementById("error-msg").textContent = "불러오기 실패: " + err.message;
        console.error(err);
      }
    }

    loadLogs();
  </script>
</body>
</html>
